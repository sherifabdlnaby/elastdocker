name: auto-release

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - main
  # pull_request event is required only for autolabeler
  pull_request:
    # `edited` keeps title-based autolabels fresh when a PR is retitled.
    types: [opened, reopened, synchronize, edited]

permissions: {}

# Serialize release drafting; never cancel a run mid-draft.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release-drafter creates/updates the draft release
      pull-requests: write # autolabeler labels PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Drafts your next Release notes as Pull Requests are merged into "main"
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        if: github.event_name == 'push'
        with:
          publish: false
          prerelease: true
          config-name: auto-release.yml

      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        if: github.event_name == 'pull_request'
        with:
          config-name: auto-release.yml
