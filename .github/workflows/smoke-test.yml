# Boots the full Elastic Stack the same way local dev does (`mise run elk:setup && mise run elk`),
# then smoke-tests that Elasticsearch and Kibana come up. Also scans the locally-built Elasticsearch
# image with Trivy and uploads the findings to the Security tab.
name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    # Weekly sweep so image CVEs surface even without a push (heavy stack, so not daily).
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions: {}

# One run per PR (or ref) — newer pushes cancel stale runs.
concurrency:
  group: smoke-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_LOCKED: "1" # every install honors mise.lock, also tools `mise run` installs later
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache downloads, not installs: `--locked` re-checks each download against mise.lock.
      - name: Cache mise downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-cas-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: mise-cas-${{ runner.os }}-

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.10.24" # pin mise itself, not just the action
          install: true
          cache: false # see the step above
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # SO tool installs don't hit API rate limits

      # Same tasks local dev runs: generate certs + keystore, then build & start the core stack.
      - name: Build & Deploy
        run: mise run elk:setup && mise run elk

      - name: Test Elasticsearch
        run: timeout 240s sh -c "until curl https://elastic:changeme@localhost:9200 --insecure --silent; do echo 'Elasticsearch Not Up, Retrying...'; sleep 3; done" && echo 'Elasticsearch is up'

      - name: Test Kibana
        run: timeout 240s sh -c "until curl https://localhost:5601 --insecure --silent -I; do echo 'Kibana Not Ready, Retrying...'; sleep 3; done" && echo 'Kibana is up'

      # Resolve the built image tag from the committed .env (ELK_VERSION rots otherwise).
      - name: Resolve scan image
        run: |
          set -a; . ./.env; set +a
          echo "SCAN_IMAGE=${ELASTICSEARCH_IMAGE_NAME}:${ELK_VERSION}" >> "$GITHUB_ENV"

      - name: Trivy scan (image → SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0" # report findings, don't fail the smoke test on a known CVE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Trivy DB pulls, avoid anonymous rate limits

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
